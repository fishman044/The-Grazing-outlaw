<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Payment Confirmation | The Grazing Outlaw</title>
<style>
:root{--cream:#fbf7ef;--paper:#fffdf8;--ink:#2b241f;--muted:#72675e;--sage:#55614f;--gold:#b89454;--line:#e8ddcf}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,var(--cream),#fff);font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.card{width:min(680px,100%);background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:0 18px 50px rgba(63,45,31,.1)}h1{font:700 2.5rem Georgia,serif;margin:.15em 0}.eyebrow{font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--sage);font-weight:800}.details{margin:22px 0;padding:18px;background:#f8f2e8;border-radius:16px}.row{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.muted{color:var(--muted)}a{display:inline-flex;padding:12px 20px;border-radius:999px;background:var(--sage);color:white;text-decoration:none;font-weight:700}.error{color:#8b2f2f}
</style>
</head>
<body>
<main class="card">
<div class="eyebrow">The Grazing Outlaw</div>
<h1 id="title">Confirming your payment…</h1>
<p class="muted" id="message">We’re checking the payment status with our secure payment provider.</p>
<div class="details" id="details" hidden></div>
<a href="/">Return to website</a>
</main>
<script>
(async()=>{
  const params=new URLSearchParams(location.search);const id=params.get('session_id');
  const title=document.getElementById('title'),message=document.getElementById('message'),details=document.getElementById('details');
  if(!id){title.textContent='Payment confirmation unavailable';message.textContent='No checkout session was provided.';message.classList.add('error');return;}
  try{
    const r=await fetch('/api/checkout-session?session_id='+encodeURIComponent(id));const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to verify payment.');
    if(data.paymentStatus==='paid'||data.paymentStatus==='no_payment_required'){
      title.textContent=data.paymentStatus==='no_payment_required'?'Thank you — booking confirmed.':'Thank you — payment received.';message.textContent=data.paymentStatus==='no_payment_required'?'Your complimentary booking was confirmed successfully.':'Your payment was processed successfully. Keep this confirmation for your records.';
      try{localStorage.removeItem('grazingOutlawBookingDraftV1');}catch(e){}
    }else{title.textContent='Payment status: '+data.paymentStatus;message.textContent='Your checkout session was found, but Stripe has not marked it paid yet.';}
    const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((data.amountTotal||0)/100);
    details.innerHTML=`<div class="row"><span>Client</span><strong>${escapeHtml(data.clientName||'—')}</strong></div><div class="row"><span>Wedding date</span><strong>${escapeHtml(data.weddingDate||'—')}</strong></div><div class="row"><span>Package</span><strong>${escapeHtml(data.package||'—')}</strong></div><div class="row"><span>Payment</span><strong>${money}</strong></div><div class="row"><span>Email</span><strong>${escapeHtml(data.customerEmail||'—')}</strong></div>`;details.hidden=false;
  }catch(e){title.textContent='We could not verify the payment';message.textContent=e.message;message.classList.add('error');}
  function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));}
})();
</script>
</body>
</html>
