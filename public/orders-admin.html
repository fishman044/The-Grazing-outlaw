<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders Dashboard | The Grazing Outlaw</title>
<style>:root{--cream:#fbf7ef;--paper:#fffdf8;--ink:#2b241f;--muted:#72675e;--sage:#55614f;--gold:#b89454;--line:#e8ddcf}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Inter,system-ui,sans-serif;color:var(--ink);padding:24px}.wrap{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 10px 28px rgba(63,45,31,.07)}h1,h2{font-family:Georgia,serif}label{font-weight:800;display:block;margin-bottom:6px}input{padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;min-width:280px}.btn{border:0;border-radius:999px;padding:12px 18px;background:var(--sage);color:white;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex}.btn.alt{background:#eee6da;color:var(--ink)}.status{padding:12px 14px;border-radius:12px;background:#f1ece3;margin-top:12px}.order{border-top:1px solid var(--line);padding:18px 0}.order:first-child{border-top:0}.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee6da;font-size:.78rem;font-weight:800}.refund{background:#fff0d6;color:#684d16}.cancelled{background:#f8dddd;color:#7b2828}.details{white-space:pre-wrap;background:#f8f2e8;border-radius:12px;padding:12px;margin-top:12px}.hidden{display:none}@media(max-width:820px){.row{grid-template-columns:1fr 1fr}}@media(max-width:520px){.row{grid-template-columns:1fr}input{min-width:0;width:100%}}</style></head>
<body><main class="wrap"><div class="top"><div><div style="font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);font-weight:800">The Grazing Outlaw</div><h1>Orders Dashboard</h1><p class="muted">Paid and complimentary bookings stored in Stripe. No Gmail integration required.</p></div><a class="btn alt" href="/refund-admin.html">Refund Admin</a></div>
<div class="card"><label for="token">Owner admin token</label><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="token" type="password" placeholder="REFUND_ADMIN_TOKEN from Render"><button class="btn" id="load">Load Orders</button></div><div class="status" id="status">Enter your private token to load bookings.</div></div>
<div class="card"><div class="top"><h2 style="margin:0">Bookings</h2><input id="search" placeholder="Search client, date, package, email"></div><div id="orders"></div></div></main>
<script>
const token=document.getElementById('token'),statusBox=document.getElementById('status'),ordersBox=document.getElementById('orders'),search=document.getElementById('search');let orders=[];
const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
function menuText(m){return Object.entries(m||{}).map(([k,v])=>`${k}: ${(v||[]).join(', ')}`).join('\n')||'None recorded';}
function render(){const q=search.value.trim().toLowerCase();const list=orders.filter(o=>!q||[o.clientName,o.customerEmail,o.weddingDate,o.package,o.venue,o.bookingReference].join(' ').toLowerCase().includes(q));ordersBox.innerHTML=list.length?list.map((o,i)=>`<section class="order"><div class="top"><div><strong>${esc(o.weddingDate||'No date')} — ${esc(o.clientName||'Client')}</strong><div class="muted">${esc(o.package)} • ${esc(o.guests)} guests • ${esc(o.venue||'Venue not provided')}</div></div><div>${o.refundRequestStatus==='pending'?'<span class="pill refund">Refund requested</span> ':''}${o.bookingCancelled?'<span class="pill cancelled">Cancelled</span> ':''}<span class="pill">${esc(o.paymentType||'payment')}</span></div></div><div class="row" style="margin-top:12px"><div><b>Paid</b><br>${money(o.amountPaidCents)}</div><div><b>Estimated total</b><br>${money(o.estimatedTotalCents)}</div><div><b>Remaining</b><br>${money(o.remainingBalanceCents)}</div><div><b>Email</b><br>${esc(o.customerEmail||'—')}</div></div><button class="btn alt" style="margin-top:12px" onclick="document.getElementById('d${i}').classList.toggle('hidden')">Order Details</button><div id="d${i}" class="details hidden"><b>Booking reference:</b> ${esc(o.bookingReference)}\n<b>Phone:</b> ${esc(o.phone||'—')}\n<b>Add-ons:</b> ${esc(o.addOns||'None')}\n<b>Dietary:</b> ${esc(o.dietary||'None')}\n<b>Allergy notes:</b> ${esc(o.allergyNotes||'None')}\n\n<b>Menu selections</b>\n${esc(menuText(o.menuSelections))}${o.refundRequestStatus?`\n\n<b>Refund request:</b> ${esc(o.refundRequestStatus)}\n<b>Requested:</b> ${o.refundRequestAmount==='full'?'Full remaining amount':money(o.refundRequestAmount)}\n<b>Reason:</b> ${esc(o.refundRequestReason||'—')}\n<b>Requested at:</b> ${esc(o.refundRequestAt||'—')}`:''}</div></section>`).join(''):'<p class="muted">No matching bookings.</p>';}
document.getElementById('load').onclick=async()=>{statusBox.textContent='Loading Stripe bookings…';try{const r=await fetch('/api/admin/orders',{headers:{'X-Refund-Admin-Token':token.value.trim()}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load orders.');orders=d.orders||[];statusBox.textContent=`Loaded ${orders.length} booking${orders.length===1?'':'s'}.`;render();}catch(e){statusBox.textContent=e.message;orders=[];render();}};search.oninput=render;
</script></body></html>
